name: Quality gate

# Runs the local `npm run verify` checks (build, links, anchors, H1/title/
# meta/canonical, images, sitemap, placeholder/preview URLs, git diff --check)
# on every PR and every push to main or a feature branch, so a broken page
# can't merge unnoticed. Read-only: no deployment, no secrets, no AWS.

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run verify
