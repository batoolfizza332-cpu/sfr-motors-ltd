AWSTemplateFormatVersion: '2010-09-09'
Description: >
  SFR Motors Ltd — static site hosting on S3 + CloudFront.
  Private bucket (Origin Access Control only, no public S3 access),
  HTTPS-only via CloudFront, gzip/brotli compression, long-lived
  caching for hashed/static assets, and a security headers policy
  (HSTS, no-sniff, referrer policy, permissions policy, frame deny).

Parameters:
  DomainName:
    Type: String
    Description: The site's domain, e.g. sfrmotors.co.uk
    Default: sfrmotors.co.uk
  AcmCertificateArn:
    Type: String
    Description: >
      ARN of an ACM certificate for DomainName, issued in us-east-1
      (CloudFront requires this). Create/validate it in ACM first —
      DNS validation can't be automated by this template.

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${DomainName}-site"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90 # ~3 months of rollback history, then delete — keeps versioning's storage cost bounded
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${DomainName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${DomainName}-security-headers"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions: { Override: true }
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ContentSecurityPolicy:
            # Matches the site's actual resources exactly, so nothing needs
            # 'unsafe-inline'/'unsafe-eval': the scripts are assets/js/main.js
            # and assets/js/analytics.js (which loads GA4's gtag.js itself),
            # the only stylesheet besides main.css is Google Fonts, the only
            # embed is the Google Maps iframe on contact.html, and the quote
            # form calls the API subdomain below. JSON-LD <script> blocks are
            # inert and aren't restricted by script-src in any current browser.
            ContentSecurityPolicy: >-
              default-src 'self';
              script-src 'self' https://www.googletagmanager.com;
              style-src 'self' https://fonts.googleapis.com;
              font-src 'self' https://fonts.gstatic.com;
              img-src 'self' https://www.googletagmanager.com https://www.google-analytics.com;
              connect-src 'self' https://api.sfrmotors.co.uk https://*.google-analytics.com https://*.analytics.google.com;
              frame-src https://maps.google.com;
              object-src 'none';
              base-uri 'self';
              form-action 'self';
              frame-ancestors 'none';
              upgrade-insecure-requests
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "geolocation=(), microphone=(), camera=()"
              Override: true

  RedirectsFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${DomainName}-redirects"
      FunctionConfig:
        Comment: >-
          301s every retired WordPress URL from the Phase 2/3 migration plan
          to its final page, and rewrites clean directory URLs (e.g.
          /about-us/) to their index.html object key — this S3 REST/OAC
          origin has no built-in index-document support on its own. Source
          of truth is infra/redirects.json; the code below is generated by
          scripts/gen-redirects.js — edit redirects.json and regenerate,
          don't hand-edit the block between the GENERATED markers.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        // BEGIN GENERATED — see infra/cloudfront-function.js / scripts/gen-redirects.js
        // Auto-generated by scripts/gen-redirects.js from infra/redirects.json.
        // Do not edit by hand — edit redirects.json and regenerate.
        //
        // CloudFront Function (viewer-request event, JS runtime 2.0). Two jobs:
        //   1. 301-redirect every retired WordPress URL in REDIRECTS to its final
        //      page (Phase 2 migration plan's one-to-one map — never a blanket
        //      redirect to the homepage).
        //   2. Rewrite a clean directory URL (e.g. /about-us/) to its index.html
        //      object key, and add the trailing slash to a bare page path (e.g.
        //      /about-us -> /about-us/) — the S3 REST/OAC origin this site uses
        //      has no built-in index-document support, unlike separate "S3
        //      static website hosting", so without this every clean URL 404s.
        //
        // Wire up: associate this function on the DefaultCacheBehavior's
        // viewer-request event (see infra/template.yaml).
        
        var REDIRECTS = {
          "/home-tyre-fitting/": "/mobile-tyre-fitting/",
          "/on-demand-mobile-tire-fitting/": "/mobile-tyre-fitting/",
          "/premium-vehicle-tyre-service/": "/our-tyre-range/",
          "/sfr-mobile-tyre-fitting-livingston/": "/mobile-tyre-fitting-livingston/",
          "/best-mobile-tyre-fitting-livingston/": "/mobile-tyre-fitting-livingston/",
          "/best-mobile-tyre-fitter-west-lothian/": "/mobile-tyre-fitting-west-lothian/",
          "/emergency-tyre-fitter-edinburgh-falkirk/": "/24-7-mobile-tyre-replacement/",
          "/mobile-tyre-fitting-bathgate-questions/": "/mobile-tyre-fitting-bathgate/",
          "/tyre-replacement-call-out-bathgate/": "/mobile-tyre-fitting-bathgate/",
          "/24-7-mobile-tyre-replacement-in-edinburgh/": "/mobile-tyre-fitting-edinburgh/",
          "/category/best-mobile-tyre-fitting-service/": "/blog/",
          "/locking-wheel-nut-removal-bathgate/": "/mobile-locking-wheel-nut-removal/",
          "/best-emergency-locking-wheel-nut-removal-in-west-lothian/": "/locking-wheel-nut-removal/",
          "/expert-locking-wheel-nut-removal/": "/locking-wheel-nut-removal/",
          "/caravan-trailer-tyre-fitting/": "/mobile-trailer-and-caravan-tyre-fitting/",
          "/emergency-tyre-change/": "/24-7-mobile-tyre-replacement/",
          "/behind-the-scenes-what-tools-do-mobile-tyre-fitters-really-use/": "/what-tools-do-mobile-tyre-fitters-use/"
        };
        
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
        
          if (REDIRECTS[uri]) {
            return {
              statusCode: 301,
              statusDescription: "Moved Permanently",
              headers: { location: { value: REDIRECTS[uri] } },
            };
          }
        
          // Bare page path with no trailing slash and no file extension -> add
          // the slash (keeps trailing-slash behaviour identical to the Vercel
          // path's "trailingSlash": true).
          if (uri !== "/" && uri.slice(-1) !== "/" && uri.indexOf(".") === -1) {
            return {
              statusCode: 301,
              statusDescription: "Moved Permanently",
              headers: { location: { value: uri + "/" } },
            };
          }
        
          // Clean directory URL -> its index.html object key.
          if (uri.slice(-1) === "/") {
            request.uri = uri + "index.html";
          }
        
          return request;
        }
        // END GENERATED

  CachePolicyStatic:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${DomainName}-static-assets"
        DefaultTTL: 604800    # 7 days
        MaxTTL: 31536000      # 1 year (assets/img, assets/css, assets/js are content-hashed on change)
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  CachePolicyHtml:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${DomainName}-html"
        DefaultTTL: 300       # 5 min — short, so content edits show up quickly
        MaxTTL: 3600
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        DefaultRootObject: index.html
        Aliases: [!Ref DomainName]
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: s3-origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: s3-origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: !Ref CachePolicyHtml
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          AllowedMethods: [GET, HEAD]
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RedirectsFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: assets/*
            TargetOriginId: s3-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: !Ref CachePolicyStatic
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            AllowedMethods: [GET, HEAD]
        CustomErrorResponses:
          # A private OAC bucket without s3:ListBucket returns 403 for a
          # missing object, not 404, so that's the one that actually fires
          # in practice — 404 is covered too in case that ever changes.
          # Both serve index.html's content but keep the real 404 status,
          # so broken links show a friendly page without being indexed as
          # a duplicate of the homepage.
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /index.html

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  BucketArn:
    Value: !GetAtt SiteBucket.Arn
    Description: Pass this as SiteBucketArn when deploying github-oidc.yaml.
  DistributionId:
    Value: !Ref Distribution
  DistributionArn:
    Value: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
    Description: Pass this as DistributionArn when deploying github-oidc.yaml.
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
    Description: Point your DNS (CNAME/ALIAS) at this if not using Route 53 alias records.
