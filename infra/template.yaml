AWSTemplateFormatVersion: '2010-09-09'
Description: >
  SFR Motors Ltd — static site hosting on S3 + CloudFront.
  Private bucket (Origin Access Control only, no public S3 access),
  HTTPS-only via CloudFront, gzip/brotli compression, long-lived
  caching for hashed/static assets, and a security headers policy
  (HSTS, no-sniff, referrer policy, permissions policy, frame deny).

Parameters:
  DomainName:
    Type: String
    Description: The site's domain, e.g. sfrmotors.co.uk
    Default: sfrmotors.co.uk
  AcmCertificateArn:
    Type: String
    Description: >
      ARN of an ACM certificate for DomainName, issued in us-east-1
      (CloudFront requires this). Create/validate it in ACM first —
      DNS validation can't be automated by this template.
  IncludeWww:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Also answer for www.<DomainName> and 301-redirect it to the apex domain
      (the WordPress site does this today, and www is a CNAME to the apex in
      DNS). The ACM certificate must cover BOTH <DomainName> and
      www.<DomainName>, otherwise the stack update is rejected. Set 'false'
      only if www is deliberately unused.

Conditions:
  ServeWww: !Equals [!Ref IncludeWww, 'true']

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${DomainName}-site"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90 # ~3 months of rollback history, then delete — keeps versioning's storage cost bounded
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${DomainName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${DomainName}-security-headers"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions: { Override: true }
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ContentSecurityPolicy:
            # Matches the site's actual resources exactly, so nothing needs
            # 'unsafe-inline'/'unsafe-eval': the scripts are assets/js/main.js
            # and assets/js/analytics.js (the cookie-consent banner, which loads
            # GA4's gtag.js only AFTER the visitor accepts analytics). The only
            # stylesheet is main.css and Roboto is self-hosted (assets/fonts), so
            # style-src and font-src are 'self' only. The only embed is the Google
            # Maps iframe on contact.html, created ONLY after the visitor presses
            # "Load Google Map" (frame-src is needed at that moment, not before:
            # maps.google.com redirects to www.google.com/maps/embed). The quote form no longer calls
            # any API (it opens a pre-filled WhatsApp message), so connect-src has
            # no first-party API origin. JSON-LD <script> blocks are inert and
            # aren't restricted by script-src in any current browser.
            # Google Analytics origins are exact hosts, no wildcards, and were
            # taken from a real gtag.js run (collection blocked locally):
            #   script-src  www.googletagmanager.com    - gtag.js itself
            #   connect-src www.google-analytics.com    - GA4 /g/collect, default endpoint
            #               region1.google-analytics.com - GA4 /g/collect, served to UK/EU visitors
            #   img-src     same two hosts              - listed in Google's CSP guide for GA4 image beacons
            # Google signals and ad personalisation are off in analytics.js, so
            # no google.com / doubleclick.net origins are needed. If GA data from
            # some visitors goes missing, check the console for CSP violations
            # from another regional *.google-analytics.com host.
            ContentSecurityPolicy: >-
              default-src 'self';
              script-src 'self' https://www.googletagmanager.com;
              style-src 'self';
              font-src 'self';
              img-src 'self' https://www.google-analytics.com https://region1.google-analytics.com;
              connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com;
              frame-src https://maps.google.com https://www.google.com;
              object-src 'none';
              base-uri 'self';
              form-action 'self';
              frame-ancestors 'none';
              upgrade-insecure-requests
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "geolocation=(), microphone=(), camera=()"
              Override: true

  CachePolicyStatic:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${DomainName}-static-assets"
        DefaultTTL: 604800    # 7 days
        MaxTTL: 31536000      # 1 year (assets/img, assets/css, assets/js are content-hashed on change)
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  CachePolicyHtml:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${DomainName}-html"
        DefaultTTL: 300       # 5 min — short, so content edits show up quickly
        MaxTTL: 3600
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  # ---------------------------------------------------------------------------
