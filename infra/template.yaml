                'how-to-change-a-tyre mobile-tyre-fitting-vs-recovery-whats-best-for-your-situation ' +
                'mobile-tyre-repair-edinburgh-west-lothian'
            ).split(' ');
            // Legacy WordPress URLs (matched with or without a trailing slash) -> 301 destination
            var legacy = {
                '/locking-wheel-nut-removal-bathgate': '/mobile-locking-wheel-nut-removal.html',
                '/24-7-mobile-tyre-replacement-in-edinburgh': '/mobile-tyre-fitting-edinburgh.html',
                '/emergency-tyre-fitter-edinburgh-falkirk': '/24-7-mobile-tyre-replacement/',
                '/caravan-trailer-tyre-fitting': '/mobile-trailer-and-caravan-tyre-fitting/',
                '/mobile-puncture-repair': '/mobile-tyre-puncture-repair/',
                '/tpms-services': '/tyre-pressure-monitoring-system/',
                '/van-tyre-replacement': '/van-tyre-replacement-services/',
                '/why-professional-mobile-tyre-services-are-information-to-all-drivers': '/why-professional-mobile-tyre-services-are-essential-for-modern-drivers/',
                '/tyre-puncture-repair-near-me-west-lothian': '/mobile-tyre-repair-edinburgh-west-lothian/',
                '/tyres-bathgate-guide': '/van-tyre-replacement-services/',
                '/expert-locking-wheel-nut-removal': '/locking-wheel-nut-removal/',
                '/tyre-replacement-call-out-bathgate': '/mobile-tyre-fitting-bathgate.html',
                '/best-emergency-locking-wheel-nut-removal-in-west-lothian': '/locking-wheel-nut-removal/',
                '/best-mobile-tyre-fitter-west-lothian': '/mobile-tyre-fitting-west-lothian.html',
                '/mobile-tyre-fitting-bathgate-questions': '/mobile-tyre-fitting-bathgate.html'
            };

            var bare = uri.length > 1 && uri.charAt(uri.length - 1) === '/' ? uri.slice(0, -1) : uri;
            var slug = bare.slice(1);
            var target = null;
            var file = null;

            if (has.call(legacy, bare)) {
                target = legacy[bare];
            } else if (uri === '/index.html') {
                // the Home page has one URL: /
                target = '/';
            } else if (uri.slice(-5) === '.html') {
                // /<file>.html -> 301 -> /<slug>/ (the pretty path is the one primary URL)
                var base = uri.slice(1, -5);
                for (var s in special) {
                    if (has.call(special, s) && special[s] === base) target = '/' + s + '/';
                }
                if (target === null && same.indexOf(base) !== -1) target = '/' + base + '/';
            } else if (has.call(special, slug)) {
                file = special[slug];
            } else if (slug !== '' && same.indexOf(slug) !== -1) {
                file = slug;
            }

            if (host.indexOf('www.') === 0) {
                // www -> apex in a single hop, keeping the path (already remapped if legacy) and query string
                var qs = '';
                for (var k in request.querystring) {
                    var v = request.querystring[k];
                    var vals = v.multiValue ? v.multiValue.map(function (m) { return m.value; }) : [v.value];
                    for (var i = 0; i < vals.length; i++) {
                        qs += (qs ? '&' : '?') + k + (vals[i] ? '=' + vals[i] : '');
                    }
                }
                return {
                    statusCode: 301,
                    statusDescription: 'Moved Permanently',
                    headers: { location: { value: 'https://' + host.slice(4) + (target !== null ? target : uri) + qs } }
                };
            }
            if (target !== null) {
                return {
                    statusCode: 301,
                    statusDescription: 'Moved Permanently',
                    headers: { location: { value: target } }
                };
            }
            if (file !== null) request.uri = '/' + file + '.html';
            return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        DefaultRootObject: index.html
        Aliases: !If [ServeWww, [!Ref DomainName, !Sub "www.${DomainName}"], [!Ref DomainName]]
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: s3-origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: s3-origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: !Ref CachePolicyHtml
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          AllowedMethods: [GET, HEAD]
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt LegacyRedirectFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: assets/*
            TargetOriginId: s3-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: !Ref CachePolicyStatic
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            AllowedMethods: [GET, HEAD]
        CustomErrorResponses:
          # A private OAC bucket without s3:ListBucket returns 403 for a
          # missing object, not 404, so that's the one that actually fires
          # in practice — 404 is covered too in case that ever changes.
          # Both serve site/404.html with the real 404 status. It is a dedicated
          # page (noindex, root-relative assets and links) because serving
          # index.html here rendered the homepage UNSTYLED for any missing URL
          # that ends in "/" or sits in a sub-folder (its assets/ links are
          # document-relative), and it looked like a duplicate homepage.
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  BucketArn:
    Value: !GetAtt SiteBucket.Arn
    Description: Pass this as SiteBucketArn when deploying github-oidc.yaml.
  DistributionId:
    Value: !Ref Distribution
  DistributionArn:
    Value: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
    Description: Pass this as DistributionArn when deploying github-oidc.yaml.
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
    Description: Point your DNS (CNAME/ALIAS) at this if not using Route 53 alias records.
