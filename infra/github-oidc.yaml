AWSTemplateFormatVersion: '2010-09-09'
Description: >
  One-time bootstrap: lets GitHub Actions deploy the SFR Motors site and
  invalidate its CloudFront cache, without storing any AWS access keys as
  GitHub secrets. Uses GitHub's OIDC provider and a narrowly-scoped IAM role
  that GitHub Actions assumes for the duration of each deploy run only.
  Deploy this once per AWS account, after the main site stack (template.yaml)
  already exists — it needs that stack's bucket and distribution to scope
  the role's permissions to exactly those two resources.

Parameters:
  GitHubOrgAndRepo:
    Type: String
    Description: >
      Your GitHub "owner/repo", e.g. batoolfizza332-cpu/sfr-motors-ltd.
      The role can only be assumed by workflow runs from this exact repo.
  GitHubBranch:
    Type: String
    Default: main
    Description: Branch allowed to assume this role (deploys should only run from here).
  SiteBucketArn:
    Type: String
    Description: ARN of the site's S3 bucket (template.yaml Outputs.BucketName, as an ARN).
  DistributionArn:
    Type: String
    Description: >
      ARN of the CloudFront distribution, e.g.
      arn:aws:cloudfront::123456789012:distribution/E1234ABCD5678
      (account ID + template.yaml Outputs.DistributionId).

Resources:
  # AWS accounts can only have ONE OIDC provider per URL. If this is the
  # first GitHub Actions role in this account, this creates it. If you've
  # already got one from another project, delete this resource and pass its
  # existing ARN into GitHubActionsRole's AssumeRolePolicyDocument instead.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        # IAM requires a value here, but for github.com's OIDC provider AWS
        # validates against its own trusted CA store rather than actually
        # checking this thumbprint — so this being stale doesn't break
        # anything in practice. Still, don't take it on faith: before
        # deploying, get the current one straight from GitHub with
        #   echo | openssl s_client -servername token.actions.githubusercontent.com \
        #     -connect token.actions.githubusercontent.com:443 -showcerts 2>/dev/null \
        #     | openssl x509 -fingerprint -sha1 -noout
        # (strip the colons, lowercase it) and swap it in below if different.
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sfr-motors-github-actions-deploy
      MaxSessionDuration: 1800 # 30 min — a deploy run never needs longer
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrgAndRepo}:ref:refs/heads/${GitHubBranch}"
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SyncSiteFiles
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub "${SiteBucketArn}/*"
              - Sid: ListBucketForSync
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Ref SiteBucketArn
              - Sid: InvalidateCache
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Ref DistributionArn

Outputs:
  RoleArn:
    Value: !GetAtt GitHubActionsDeployRole.Arn
    Description: >
      Put this in the GitHub repo's Settings -> Secrets and variables ->
      Actions -> Variables, as AWS_DEPLOY_ROLE_ARN (a variable, not a
      secret — it's not sensitive, it's just an ARN the workflow assumes).
